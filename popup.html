
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaptube</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      width: 280px;
      padding: 18px;
      color: #202124;
      background: #f7f8fa;
    }
    h1 { margin: 0 0 8px; color: #1769ff; }
    p { line-height: 1.5; }
    .status {
      padding: 12px;
      border-radius: 10px;
      background: #e4f7e9;
    }
  </style>
</head>
<body>
  <h1>Gaptube</h1>
  <p>ตัวช่วยบล็อกคำขอโฆษณาบน Safari</p>
  <div class="status">
    สถานะ: เตรียมไฟล์กฎแล้ว
  </div>
  <p>หมายเหตุ: ต้องติดตั้งส่วนขยาย Safari ก่อนจึงจะบล็อกคำขอได้</p>
</body>
</html>
